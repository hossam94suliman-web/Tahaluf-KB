<!DOCTYPE html>
<html>
<head>
          <link rel="icon" href="knowledge.png" type="image/png" sizes="512x512" />   
    <title>Password Protected Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .password-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .password-container h2 {
            margin-top: 0;
            color: #333;
        }
        
        .password-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .password-form button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        
        .password-form button:hover {
            background-color: #3367d6;
        }
        
        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h2>Knowledge Base Access</h2>
        <p>Please enter the password to access the knowledge base</p>
        <form id="passwordForm" class="password-form">
            <input type="password" id="passwordInput" placeholder="Enter password" required>
            <div id="errorMessage" class="error-message">Incorrect password. Please try again.</div>
            <button type="submit">Access Knowledge Base</button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        // Handle form submission
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            
            if (window.AuthSystem.authenticate(password)) {
                // Redirect to your main page
                window.location.href = "KB HTML.html"; // Replace with your main page
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        });
        
        // If already authenticated, redirect to main page
        if (window.AuthSystem.isAuthenticated()) {
            window.location.href = "KB HTML.html";
        }
    </script>
</body>
</html>
