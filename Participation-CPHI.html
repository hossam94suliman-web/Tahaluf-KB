<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .container h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }

        .container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .container input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .container button:hover {
            background-color: #0056b3;
        }

        .counter {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px 20px;
            }

            .container h1 {
                font-size: 20px;
            }

            .container input, .container button {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Word Generator</h1>

        <input id="date" placeholder="Date" type="text">
        <input id="company_name" placeholder="Company" type="text">
        <input id="booth" placeholder="Booth Num" type="text">
        <input id="name" placeholder="Name" type="text">
        <input id="passport" placeholder="Passport Number" type="text">
        <input id="exp_date" placeholder="Expiry Date" type="text">
        <input id="date_arrival" placeholder="Arrival Date" type="text">
        <input id="date_departure" placeholder="Departure Date" type="text">

        <button onclick="generateDoc()">Generate Word</button>

        <!-- ✅ Counter display -->
        <div class="counter" id="counter">Downloads: 0</div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.66.7/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <script>
        // ✅ Load counter on page start
        function loadCounter() {
            let count = localStorage.getItem("downloadCount") || 0;
            document.getElementById("counter").innerText = "Downloads: " + count;
        }

        // ✅ Increment counter
        function incrementCounter() {
            let count = localStorage.getItem("downloadCount") || 0;
            count++;
            localStorage.setItem("downloadCount", count);
            document.getElementById("counter").innerText = "Downloads: " + count;
        }

        async function generateDoc() {
            try {
                const response = await fetch("CPHI ME 2026 - Exhibitor Invitation Letter 1 Signed and Stamped december 2026 (1).docx");
                const content = await response.arrayBuffer();

                const zip = new PizZip(content);

                const doc = new window.docxtemplater(zip, {
                    delimiters: {
                        start: "{{",
                        end: "}}"
                    },
                    paragraphLoop: true,
                    linebreaks: true
                });

                doc.render({
                    date: document.getElementById("date").value,
                    company_name: document.getElementById("company_name").value,
                    booth: document.getElementById("booth").value,
                    name: document.getElementById("name").value,
                    passport: document.getElementById("passport").value,
                    exp_date: document.getElementById("exp_date").value,
                    date_arrival: document.getElementById("date_arrival").value,
                    date_departure: document.getElementById("date_departure").value
                });

                const blob = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                });

                const name = document.getElementById("name").value || "Participation_Letter";
                const fileName = `${name.replace(/[^a-zA-Z0-9]/g, "_")}.docx`;

                saveAs(blob, fileName);

                // ✅ Count download
                incrementCounter();

            } catch (error) {
                console.error(error);

                if (error.properties?.errors) {
                    error.properties.errors.forEach(e => {
                        console.log("Tag error:", e.properties.explanation);
                    });
                }
            }
        }

        // ✅ Initialize counter on load
        loadCounter();
    </script>

</body>
</html>
